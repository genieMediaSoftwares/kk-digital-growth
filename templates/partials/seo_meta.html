{% load static %}{# Per-page SEO head tags. Include with seo_title, seo_description and seo_path (e.g. "/about/"). #}
    <title>{{ seo_title }}</title>
    <meta name="description" content="{{ seo_description }}">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="https://www.kkdigitalgrowth.com{{ seo_path }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KK Digital Growth">
    <meta property="og:locale" content="en_IN">
    <meta property="og:url" content="https://www.kkdigitalgrowth.com{{ seo_path }}">
    <meta property="og:title" content="{{ seo_title }}">
    <meta property="og:description" content="{{ seo_description }}">
    <meta property="og:image" content="https://www.kkdigitalgrowth.com{% static 'images/kk-logo.png' %}">
    <meta property="og:image:alt" content="KK Digital Growth">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ seo_title }}">
    <meta name="twitter:description" content="{{ seo_description }}">
    <meta name="twitter:image" content="https://www.kkdigitalgrowth.com{% static 'images/kk-logo.png' %}">
