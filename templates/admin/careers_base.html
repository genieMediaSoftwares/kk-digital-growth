<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Careers{% endblock %} | KK Digital Growth Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body.admin-body {
            background-color: #F1F5F9;
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
            color: #0F172A;
            overflow-x: hidden;
        }
        .admin-nav {
            background: #0B192C !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 12px 24px;
        }
        .admin-nav-brand {
            color: #FFFFFF !important;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .panel-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(15, 61, 117, 0.04);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .panel-card-header {
            padding: 18px 24px;
            border-bottom: 1px solid #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .panel-card-title {
            font-size: 16.5px;
            font-weight: 700;
            color: #0F3D75;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title {
            color: #0F3D75;
            font-size: 26px;
            font-weight: 800;
        }
        .btn-orange-primary {
            background: linear-gradient(135deg, #F79421 0%, #ff9e3b 100%) !important;
            border: none !important;
            color: #FFFFFF !important;
            font-weight: 700 !important;
            border-radius: 50px !important;
            box-shadow: 0 8px 20px rgba(247, 148, 33, 0.3) !important;
        }
        .btn-orange-primary:hover {
            box-shadow: 0 12px 28px rgba(247, 148, 33, 0.4) !important;
        }
        .tab-pill {
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 14px;
            border: 1.5px solid #CBD5E1;
            background: #FFFFFF;
            color: #0F3D75;
            text-decoration: none;
        }
        .tab-pill:hover { border-color: #F79421; color: #c26a00; }
        .tab-pill.active { background: #0F3D75; border-color: #0F3D75; color: #FFFFFF; }
        .status-badge { font-weight: 700; font-size: 12px; border-radius: 50px; padding: 5px 11px; }
        .status-published { background: #DCFCE7; color: #166534; }
        .status-draft { background: #FEF3C7; color: #92400E; }
        .status-closed { background: #E2E8F0; color: #334155; }
        .status-expired { background: #FEE2E2; color: #991B1B; }
        .table > :not(caption) > * > * { padding: 14px 16px; vertical-align: middle; }
        .form-label { font-weight: 700; color: #0F172A; }
        .form-text { font-size: 13px; }
        a:focus-visible, button:focus-visible, .form-control:focus, .form-select:focus {
            outline: 3px solid rgba(15, 61, 117, 0.45);
            outline-offset: 2px;
        }
    </style>
</head>
<body class="admin-body">

    <nav class="navbar admin-nav sticky-top">
        <div class="container-fluid px-2 px-md-4">
            <a class="admin-nav-brand" href="{% url 'admin_dashboard' %}">
                <img src="/static/images/kk-logo.png" alt="KK Digital Growth" style="height: 36px; width: auto; object-fit: contain;">
                <span>KKdigital <span style="color: #F79421;">growth</span></span>
            </a>
            <div class="d-flex align-items-center gap-2 flex-wrap ms-auto">
                <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-light btn-sm px-3 rounded-pill fw-semibold">
                    <i class="fa-solid fa-gauge-high me-1"></i> Dashboard
                </a>
                <a href="{% url 'careers_admin_list' %}" class="btn btn-orange-primary btn-sm px-3">
                    <i class="fa-solid fa-briefcase me-1"></i> Jobs
                </a>
                <a href="{% url 'careers_admin_applications' %}" class="btn btn-orange-primary btn-sm px-3">
                    <i class="fa-solid fa-inbox me-1"></i> Applications
                </a>
                <span class="text-white small d-none d-lg-inline-block px-2">
                    <i class="fa-solid fa-circle-user me-1 text-warning"></i> {{ admin_email }}
                </span>
                <a href="{% url 'admin_logout' %}" class="btn btn-outline-light btn-sm px-3 rounded-pill fw-semibold">
                    <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-3 px-md-4 py-4" style="max-width: 1360px;">
        {% if messages %}
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} rounded-4 fw-semibold" role="{% if message.tags == 'error' %}alert{% else %}status{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
