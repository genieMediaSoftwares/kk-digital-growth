<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - KK Digital Growth</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Gold Theme CSS -->
    <link rel="stylesheet" href="/static/css/admin-login.css">
</head>
<body class="admin-body">

    <div class="admin-login-wrapper">
        <div class="admin-card">
            
            <!-- Header Section -->
            <div class="admin-card-header">
                <div class="admin-brand-icon">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h1 class="admin-card-title">Admin Portal</h1>
                <p class="admin-card-subtitle">Sign in to access your administrative dashboard</p>
            </div>

            <!-- Body Section -->
            <div class="admin-card-body">
                
                <!-- Display Error Message -->
                {% if error_message %}
                <div class="alert-custom-danger" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-1"></i>
                    <span>{{ error_message }}</span>
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="POST" action="{% url 'admin_login' %}" id="adminLoginForm" novalidate>
                    {% csrf_token %}

                    <!-- Email Field -->
                    <div class="input-group-custom">
                        <i class="fa-regular fa-envelope input-icon-left"></i>
                        {{ form.email }}
                    </div>

                    <!-- Password Field with Show/Hide Toggle -->
                    <div class="input-group-custom">
                        <i class="fa-solid fa-lock input-icon-left"></i>
                        {{ form.password }}
                        <button type="button" class="password-toggle-btn" id="togglePassword" title="Show / Hide Password">
                            <i class="fa-regular fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-gold-gradient mt-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                    </button>

                </form>

            </div>

        </div>
    </div>

    <!-- Password Show/Hide Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('admin-password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (togglePasswordBtn && passwordInput && toggleIcon) {
                togglePasswordBtn.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    if (type === 'text') {
                        toggleIcon.classList.remove('fa-eye');
                        toggleIcon.classList.add('fa-eye-slash');
                    } else {
                        toggleIcon.classList.remove('fa-eye-slash');
                        toggleIcon.classList.add('fa-eye');
                    }
                });
            }
        });
    </script>
</body>
</html>
